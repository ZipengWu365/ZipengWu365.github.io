<title id="title">A research map of temporal representation</title><desc id="desc">Symbolic representation: Discrete temporal structure: Temporal / language-action tokenization. Compression: Compact representations of time series: Retaining task-relevant information. Frequency conversion: Transforming the temporal representation: A dedicated direction in the research map. Similarity measurement: Comparing temporal structure: EchoTime · similarity and retrieval. Forecasting: Using temporal structure to predict: Retrieval / multi-output prediction. Classification: Using temporal structure to distinguish: Current research · time-series classification. Connections denote research relationships; individual works may span several directions.</desc>
