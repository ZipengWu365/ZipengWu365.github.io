<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" aria-labelledby="title desc" role="img" viewBox="0 0 1400 840"><title id="title">DeTime title card</title><desc id="desc">A research software title card with signal plots and method badges for DeTime.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#f7fafc"/><stop offset="55%" stop-color="#edf3fb"/><stop offset="100%" stop-color="#e7eef8"/></linearGradient><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f7fbff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="16" flood-color="#173255" flood-opacity=".12" stdDeviation="18"/></filter></defs><rect width="1400" height="840" fill="url(#bg)"/><rect width="1272" height="712" x="64" y="64" fill="#fff" opacity=".82" rx="36"/><g filter="url(#shadow)"><rect width="820" height="656" x="92" y="92" fill="url(#panel)" rx="30"/><rect width="364" height="656" x="944" y="92" fill="url(#panel)" rx="30"/></g><text x="138" y="182" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="700">DeTime</text><text x="138" y="228" fill="#334155" font-family="Helvetica, Arial, sans-serif" font-size="30">Research software for reproducible time-series decomposition.</text><text x="138" y="268" fill="#5b6778" font-family="Helvetica, Arial, sans-serif" font-size="25">Unified APIs, visual reports, native acceleration, and multivariate workflows.</text><g><rect width="120" height="42" x="138" y="314" fill="#0b5fff" rx="21"/><text x="170" y="341" fill="#fff" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700">SSA</text><rect width="120" height="42" x="274" y="314" fill="#eff6ff" stroke="#b7cdfa" rx="21"/><text x="306" y="341" fill="#0b3a8f" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700">STD</text><rect width="128" height="42" x="410" y="314" fill="#eff6ff" stroke="#b7cdfa" rx="21"/><text x="438" y="341" fill="#0b3a8f" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700">MSSA</text><rect width="144" height="42" x="554" y="314" fill="#ecfdf5" stroke="#b5ead0" rx="21"/><text x="581" y="341" fill="#0f766e" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700">Native-backed</text></g><g><text x="138" y="415" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Single-series decomposition</text><rect width="720" height="126" x="138" y="436" fill="#f8fbff" stroke="#d7e1ee" rx="22"/><line x1="170" x2="830" y1="530" y2="530" stroke="#d5deea" stroke-width="2"/><polyline fill="none" stroke="#0b5fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6" points="170 501 205 493 240 470 275 484 310 443 345 462 380 432 415 458 450 477 485 453 520 486 555 520 590 510 625 552 660 542 695 575 730 560 765 584 800 567 830 592"/><polyline fill="none" stroke="#f97316" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" points="170 495 205 492 240 488 275 485 310 479 345 475 380 470 415 466 450 462 485 456 520 450 555 444 590 438 625 431 660 425 695 420 730 413 765 407 800 402 830 396"/><polyline fill="none" stroke="#8b5cf6" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" points="170 538 205 550 240 555 275 548 310 566 345 558 380 572 415 561 450 549 485 562 520 546 555 534 590 542 625 526 660 533 695 518 730 522 765 510 800 515 830 503"/><text x="172" y="587" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="19">Observed</text><text x="262" y="587" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="19">Trend</text><text x="331" y="587" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="19">Seasonal</text></g><g><text x="138" y="645" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Multivariate structure</text><rect width="720" height="50" x="138" y="666" fill="#f8fbff" stroke="#d7e1ee" rx="16"/><rect width="150" height="24" x="168" y="679" fill="#dbeafe" rx="12"/><rect width="206" height="24" x="332" y="679" fill="#c7d2fe" rx="12"/><rect width="132" height="24" x="552" y="679" fill="#bfdbfe" rx="12"/><rect width="118" height="24" x="698" y="679" fill="#e0e7ff" rx="12"/><text x="138" y="744" fill="#475569" font-family="Helvetica, Arial, sans-serif" font-size="20">From one signal to channelwise and joint workflows on the same public contract.</text></g><g><text x="980" y="174" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Project snapshot</text><rect width="292" height="70" x="980" y="208" fill="#f8fbff" stroke="#d7e1ee" rx="18"/><text x="1006" y="238" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="18">Package</text><text x="1006" y="264" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">de-time</text><rect width="292" height="70" x="980" y="296" fill="#f8fbff" stroke="#d7e1ee" rx="18"/><text x="1006" y="326" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="18">Preferred import</text><text x="1006" y="352" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">detime</text><rect width="292" height="124" x="980" y="384" fill="#f8fbff" stroke="#d7e1ee" rx="18"/><text x="1006" y="414" fill="#64748b" font-family="Helvetica, Arial, sans-serif" font-size="18">Core methods</text><text x="1006" y="447" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">SSA · STD · STDR</text><text x="1006" y="478" fill="#0f172a" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">STDR · MSSA</text><rect width="292" height="96" x="980" y="526" fill="#f8fbff" stroke="#d7e1ee" rx="18"/><text x="1006" y="556" fill="#64748b" font-family="Helvetica, Arial, sans-se